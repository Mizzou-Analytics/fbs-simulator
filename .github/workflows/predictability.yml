name: Play-call predictability

# Ranks FBS offenses by how predictable their run/pass calls are. Run it by
# hand from the Actions tab; it also runs when the analysis code changes on a
# branch. Each run uses about 18 CFBD calls. The results are in the job
# summary and the "predictability" artifact.
on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season"
        default: "2026"
      mode:
        description: "Scoring: loo (each game from the team's other games) or rolling (earlier games only)"
        type: choice
        options: [loo, rolling]
        default: loo
  push:
    branches-ignore: [main]
    paths: ["analysis/predictability/**", ".github/workflows/predictability.yml"]

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/predictability/requirements.txt
      - run: pip install -r analysis/predictability/requirements.txt
      - run: python -m unittest discover -s analysis/predictability/tests
      - name: Rank offenses
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python analysis/predictability/run.py --season "${{ inputs.season || '2026' }}" --out out --mode "${{ inputs.mode || 'loo' }}"
          tee -a "$GITHUB_STEP_SUMMARY" < out/summary.md
      - uses: actions/upload-artifact@v5
        with:
          name: predictability-${{ inputs.season || '2026' }}
          path: out/
